<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Запись партии</title>
<!-- The replay player of a recorded Aurelia game (crates/qa/src/frames.rs, ai-replay-frames):
     the frames are embedded below in place of the slot, so the page opens from file:// with no
     server and no external script. -->
<style>
:root{--bg:#fbfaf7;--fg:#1f1d1a;--muted:#6b665e;--line:#e3ded5;--card:#fff;--accent:#2c5d8a;--ok:#2f7d4f;--bad:#b4442f;--gold:#c99a1c;--ink:#1f1d1a;--paper:#fff;--hit:#d23c2a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#16161a;--fg:#e8e6e1;--muted:#a09a90;--line:#33322f;--card:#1e1e23;--accent:#7fb2e0;--ok:#6cc28f;--bad:#e58a76;--gold:#e6c25a;--ink:#0d0d10;--paper:#f2f0ea;--hit:#ff6b57}}
:root[data-theme="dark"]{--bg:#16161a;--fg:#e8e6e1;--muted:#a09a90;--line:#33322f;--card:#1e1e23;--accent:#7fb2e0;--ok:#6cc28f;--bad:#e58a76;--gold:#e6c25a;--ink:#0d0d10;--paper:#f2f0ea;--hit:#ff6b57}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;padding:14px 16px 40px}
main{max-width:1180px;margin:0 auto}
h1{font-size:20px;margin:0 0 2px;line-height:1.25}
.sub{color:var(--muted);font-size:13px;margin:0 0 8px}
.outcome{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px 12px;margin:0 0 10px;font-size:16px}
.outcome b.ok{color:var(--ok)}.outcome b.bad{color:var(--bad)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}
.mapbox{position:relative;background:var(--card);border:1px solid var(--line);border-radius:6px;overflow:hidden;touch-action:none}
canvas{display:block;width:100%;cursor:grab}
.zoom{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:4px}
.zoom button{width:34px;height:34px;font-size:18px;padding:0}
button,select{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer;min-height:34px}
button:hover{border-color:var(--accent)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:10px 0 4px}
.bar input[type=range]{flex:1 1 160px;min-width:120px;accent-color:var(--accent)}
.now{font-size:15px;margin:2px 0 8px}
.now b{font-variant-numeric:tabular-nums}
.panel{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin-bottom:12px}
.panel h2{font-size:14px;margin:0 0 6px;color:var(--muted);font-weight:600}
.players div{display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px;padding:3px 0;font-size:14px}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;flex:0 0 12px;border:1px solid rgba(0,0,0,.25)}
.players .stat{flex:1 0 100%;padding-left:20px;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.dead{opacity:.5;text-decoration:line-through}
ol.events{list-style:none;margin:0;padding:0;max-height:420px;overflow:auto;font-size:14px}
ol.events li{padding:4px 0;border-bottom:1px solid var(--line);cursor:pointer}
ol.events li:last-child{border-bottom:0}
ol.events li.scene{color:var(--muted)}
ol.events li.big{font-weight:600}
ol.events li:hover{color:var(--accent)}
.panel h2 select{font-size:13px;min-height:28px;padding:2px 6px;margin-left:6px;font-weight:normal;max-width:190px}
.emp{font-size:14px}.emp p{margin:2px 0}.emp .k{color:var(--muted)}
.emp table{border-collapse:collapse;width:100%;font-size:13px;margin-top:6px}.emp td{border-top:1px solid var(--line);padding:2px 4px;vertical-align:top}
.emp td:nth-child(2){text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0 8px}.chips button{font-size:13px;min-height:28px;padding:2px 10px;border-radius:14px}
.chips button.on{border-color:var(--accent);color:var(--accent);font-weight:600}
ol.timeline{list-style:none;margin:0;padding:0;max-height:360px;overflow:auto;font-size:14px;columns:2 300px;column-gap:24px}
ol.timeline li{padding:2px 0;cursor:pointer;break-inside:avoid}ol.timeline li:hover{color:var(--accent)}
ol.timeline li.now{background:color-mix(in srgb,var(--accent) 14%,transparent);border-radius:4px}
ol.timeline .r{display:inline-block;min-width:44px;color:var(--muted);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.info{font-size:14px;min-height:20px}
details{margin-top:14px;font-size:13px;color:var(--muted)}
details pre{white-space:pre-wrap;word-break:break-all}
.theme{float:right;margin-left:8px}
.legend{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:6px}
</style>
</head>
<body>
<main>
<button class="theme" id="theme" title="Тема">◐</button>
<h1 id="title">Запись партии</h1>
<p class="sub" id="sub"></p>
<div class="outcome" id="outcome"></div>
<div class="grid">
  <div>
    <div class="mapbox" id="mapbox">
      <canvas id="map" aria-label="Карта"></canvas>
      <div class="zoom"><button id="zin" title="Приблизить">+</button><button id="zout" title="Отдалить">−</button><button id="zfit" title="Вся карта">⤢</button></div>
    </div>
    <div class="bar">
      <button id="first" title="К началу">⏮</button>
      <button id="prev" title="Кадр назад (←)">◀</button>
      <button id="play" title="Пуск/пауза (пробел)">▶</button>
      <button id="next" title="Кадр вперёд (→)">▶︎|</button>
      <button id="last" title="К концу">⏭</button>
      <input type="range" id="seek" min="0" value="0" aria-label="Кадр">
      <select id="speed" title="Скорость"><option value="0.5">0,5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option><option value="8">8×</option></select>
    </div>
    <div class="now" id="now"></div>
    <div class="info" id="info"><span class="muted">Нажмите на клетку, чтобы увидеть, что на ней.</span></div>
    <div class="legend" id="legend"></div>
  </div>
  <div>
    <div class="panel"><h2>Стороны</h2><div class="players" id="players"></div></div>
    <div class="panel"><h2>Империя<select id="emp" aria-label="Игрок"></select></h2><div class="emp" id="empire"></div></div>
    <div class="panel"><h2 id="evhead">События кадра</h2><ol class="events" id="events"></ol></div>
  </div>
</div>
<div class="panel" id="tlbox"><h2 id="tlhead">Решения за партию</h2><div class="chips" id="tlchips"></div><ol class="timeline" id="timeline"></ol></div>
<details><summary>Технические подробности</summary><pre id="tech"></pre></details>
</main>
<script>
const DATA = /*FRAMES*/null;
(function () {
  "use strict";
  if (!DATA) { document.getElementById("title").textContent = "Нет данных записи"; return; }
  const $ = (id) => document.getElementById(id);
  const map = DATA.map, legend = DATA.legend, players = DATA.players, frames = DATA.frames, scene = DATA.scene;
  const N = map.coords.length;
  const battle = scene.battle && typeof scene.battle === "object" ? scene.battle : null;
  const learnerSide = battle ? battle.learner : null, enemySide = battle ? battle.enemy : null;

  // ---------- theme ----------
  const root = document.documentElement;
  try { const t = localStorage.getItem("aurelia-replay-theme"); if (t) root.dataset.theme = t; } catch (e) {}
  $("theme").onclick = () => {
    const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    root.dataset.theme = dark ? "light" : "dark";
    try { localStorage.setItem("aurelia-replay-theme", root.dataset.theme); } catch (e) {}
    draw();
  };
  const css = (v) => getComputedStyle(root).getPropertyValue(v).trim();

  // ---------- colours: the nations' own, pulled apart where two are alike ----------
  function hexRgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
  function rgbHex(c) { return "#" + c.map((x) => Math.max(0, Math.min(255, Math.round(x))).toString(16).padStart(2, "0")).join(""); }
  function rgbHsl([r, g, b]) { r /= 255; g /= 255; b /= 255; const mx = Math.max(r, g, b), mn = Math.min(r, g, b); let h = 0, s = 0; const l = (mx + mn) / 2;
    if (mx !== mn) { const d = mx - mn; s = l > .5 ? d / (2 - mx - mn) : d / (mx + mn);
      h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; h /= 6; }
    return [h * 360, s, l]; }
  function hslHex(h, s, l) { h = ((h % 360) + 360) % 360 / 360; const f = (p, q, t) => { t = (t + 1) % 1; return t < 1 / 6 ? p + (q - p) * 6 * t : t < .5 ? q : t < 2 / 3 ? p + (q - p) * (2 / 3 - t) * 6 : p; };
    const q = l < .5 ? l * (1 + s) : l + s - l * s, p = 2 * l - q; return rgbHex([f(p, q, h + 1 / 3), f(p, q, h), f(p, q, h - 1 / 3)].map((x) => x * 255)); }
  const colour = [];
  const usedHues = [];
  players.forEach((p, i) => {
    let c;
    if (p.kind === "barbarian") c = "#6b1a10";
    else if (p.kind === "city-state") c = hslHex(i * 47, .12, .62);
    else {
      let [h, s, l] = rgbHsl(hexRgb(p.color || "#888888"));
      for (let k = 0; k < 12 && usedHues.some((u) => Math.min(Math.abs(u - h), 360 - Math.abs(u - h)) < 22); k++) h = (h + 37) % 360;
      usedHues.push(h);
      c = hslHex(h, Math.max(s, .45), Math.min(Math.max(l, .38), .58));
    }
    colour[i] = c;
  });
  function textOn(c) { const [r, g, b] = hexRgb(c); return (0.299 * r + 0.587 * g + 0.114 * b) > 150 ? "#111" : "#fff"; }

  // ---------- names ----------
  const MIND = { learner: "сеть", standard: "standard" };
  function pname(p) { const x = players[p]; if (!x) return "игрок " + p;
    if (x.kind === "barbarian") return "Варвары";
    if (x.kind === "city-state") return (x.name || "Город-государство") + " (город-государство)";
    return x.name || ("игрок " + p); }
  function pshort(p) { const x = players[p]; if (!x) return "игрок " + p; if (x.kind === "barbarian") return "Варвары"; return x.name || ("игрок " + p); }
  // A seat's mind: the learner is «сеть»; a frozen net (`net:<path>/iter_0004.bin`) is «сеть iter_0004».
  function pmind(p) { const x = players[p]; if (!x || x.kind !== "major") return ""; if (x.learner && (!x.mind || x.mind === "learner")) return "сеть";
    const m = x.mind || ""; if (m.startsWith("net:")) return "сеть " + m.split("/").pop().replace(/\.bin$/, ""); return MIND[m] || m; }
  function uname(k) { return (legend.units[k] && legend.units[k].name) || ("отряд " + k); }
  function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]); }
  function sw(p) { return '<i class="sw" style="background:' + colour[p] + '"></i>'; }
  const KIND = { siege: "Осада", defence: "Оборона", field: "Полевое сражение", opening: "Дебют", economy: "Экономическое окно" };

  // ---------- geometry: pointy-top axial hexes, as the game's renderer lays them ----------
  const SQ3 = Math.sqrt(3);
  const cx = new Float64Array(N), cy = new Float64Array(N);
  const byCoord = new Map();
  for (let i = 0; i < N; i++) { const [q, r] = map.coords[i]; cx[i] = SQ3 * (q + r / 2); cy[i] = 1.5 * r; byCoord.set(q + "," + r, i); }
  const DIRS = [[1, 0], [1, -1], [0, -1], [-1, 0], [-1, 1], [0, 1]];
  const nbr = [];
  for (let i = 0; i < N; i++) { const [q, r] = map.coords[i]; nbr.push(DIRS.map(([dq, dr]) => byCoord.has((q + dq) + "," + (r + dr)) ? byCoord.get((q + dq) + "," + (r + dr)) : -1)); }
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (let i = 0; i < N; i++) { minX = Math.min(minX, cx[i]); maxX = Math.max(maxX, cx[i]); minY = Math.min(minY, cy[i]); maxY = Math.max(maxY, cy[i]); }
  minX -= 1; maxX += 1; minY -= 1.2; maxY += 1.2;
  // Camps and ruins among the improvements (`legend.improvement_kinds`), and the barbarian player.
  const siteKind = (imp) => imp === NONE ? null : ((legend.improvement_kinds || [])[imp & 0x7fff] || null);
  const barbarian = players.findIndex((p) => p.kind === "barbarian");
  // A tile id of the whole map (row-major q + r * width) as an index of the window (-1: outside).
  const tileIndex = (t) => { const k = byCoord.get((t % map.width) + "," + Math.floor(t / map.width)); return k === undefined ? -1 : k; };
  const terr = (i) => legend.terrain[map.terrain[i]] || { color: "#999", water: false };
  const shore = new Uint8Array(N);
  for (let i = 0; i < N; i++) if (terr(i).water) shore[i] = nbr[i].some((j) => j >= 0 && !terr(j).water) ? 1 : 0;

  // ---------- frame state: tiles rebuilt from the changes, units and cities as given ----------
  const T_OWNER = 0, T_IMP = 1, T_ROUTE = 2, T_FEAT = 3, NONE = 65535;
  let tiles = new Uint16Array(N * 4).fill(NONE);
  let built = -1;
  function stateAt(k) {
    if (k < built) { tiles = new Uint16Array(N * 4).fill(NONE); built = -1; }
    for (let f = built + 1; f <= k; f++) for (const c of frames[f].tiles) { const i = c[0]; for (let j = 0; j < 4; j++) tiles[i * 4 + j] = c[1 + j]; }
    built = k;
  }

  // ---------- view ----------
  const canvas = $("map"), ctx = canvas.getContext("2d");
  let view = { s: 10, ox: 0, oy: 0 };
  function fit() {
    const w = canvas.clientWidth || 600;
    const aspect = (maxY - minY) / (maxX - minX);
    const h = Math.max(260, Math.min(window.innerHeight * 0.72, w * aspect));
    canvas.style.height = h + "px";
    const s = Math.min(w / (maxX - minX), h / (maxY - minY));
    view = { s, ox: (w - (maxX - minX) * s) / 2 - minX * s, oy: (h - (maxY - minY) * s) / 2 - minY * s };
  }
  const X = (i) => cx[i] * view.s + view.ox, Y = (i) => cy[i] * view.s + view.oy;
  function hexPath(x, y, r) { ctx.beginPath(); for (let k = 0; k < 6; k++) { const a = Math.PI / 180 * (60 * k - 30); ctx.lineTo(x + r * Math.cos(a), y + r * Math.sin(a)); } ctx.closePath(); }
  // The corner pair of the edge toward neighbour direction d (pointy-top).
  const EDGE = [[0, 1], [5, 0], [4, 5], [3, 4], [2, 3], [1, 2]];
  function corner(x, y, r, k) { const a = Math.PI / 180 * (60 * k - 30); return [x + r * Math.cos(a), y + r * Math.sin(a)]; }

  let cur = 0, playing = false, timer = null, selected = -1, flash = [];

  function shade(hex, f) { const c = hexRgb(hex); return rgbHex(c.map((x) => f < 0 ? x * (1 + f) : x + (255 - x) * f)); }

  function draw() {
    const dpr = window.devicePixelRatio || 1;
    const w = canvas.clientWidth, h = canvas.clientHeight;
    if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) { canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr); }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    stateAt(cur);
    const f = frames[cur], s = view.s, r = s * 1.0;
    const ink = css("--ink");
    // terrain
    for (let i = 0; i < N; i++) {
      const x = X(i), y = Y(i);
      if (x < -s * 2 || y < -s * 2 || x > w + s * 2 || y > h + s * 2) continue;
      const t = terr(i);
      let c = t.color;
      if (t.water) c = shore[i] ? shade(c, 0.25) : shade(c, -0.18);
      hexPath(x, y, r + 0.4); ctx.fillStyle = c; ctx.fill();
      if (s >= 9) {
        if (t.mountains) { ctx.fillStyle = shade(t.color, -0.35); ctx.beginPath(); ctx.moveTo(x - r * .5, y + r * .35); ctx.lineTo(x, y - r * .5); ctx.lineTo(x + r * .5, y + r * .35); ctx.closePath(); ctx.fill(); }
        else if (t.hills) { ctx.strokeStyle = shade(t.color, -0.3); ctx.lineWidth = Math.max(1, s * .08); ctx.beginPath(); ctx.arc(x - r * .25, y + r * .25, r * .28, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke(); ctx.beginPath(); ctx.arc(x + r * .25, y + r * .1, r * .28, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke(); }
        const feat = tiles[i * 4 + T_FEAT];
        if (feat !== NONE) { ctx.fillStyle = "rgba(20,50,20,.35)"; for (const [dx, dy] of [[-.35, -.15], [.3, -.3], [0, .3], [.35, .25], [-.3, .35]]) { ctx.beginPath(); ctx.arc(x + dx * r, y + dy * r, r * .1, 0, 7); ctx.fill(); } }
      }
    }
    // territory tint and borders
    for (let i = 0; i < N; i++) {
      const o = tiles[i * 4 + T_OWNER]; if (o === NONE) continue;
      const x = X(i), y = Y(i);
      hexPath(x, y, r); ctx.fillStyle = colour[o] + "33"; ctx.fill();
      ctx.strokeStyle = colour[o]; ctx.lineWidth = Math.max(1.5, s * .14);
      for (let d = 0; d < 6; d++) { const j = nbr[i][d]; if (j >= 0 && tiles[j * 4 + T_OWNER] === o) continue;
        const [a, b] = EDGE[d]; const p = corner(x, y, r * .9, a), q = corner(x, y, r * .9, b); ctx.beginPath(); ctx.moveTo(p[0], p[1]); ctx.lineTo(q[0], q[1]); ctx.stroke(); }
    }
    // rivers
    ctx.strokeStyle = "#2d7fc1"; ctx.lineWidth = Math.max(1.5, s * .16); ctx.lineCap = "round";
    for (const [a, b] of map.rivers) { const d = nbr[a].indexOf(b); if (d < 0) continue; const [k1, k2] = EDGE[d]; const p = corner(X(a), Y(a), r, k1), q = corner(X(a), Y(a), r, k2); ctx.beginPath(); ctx.moveTo(p[0], p[1]); ctx.lineTo(q[0], q[1]); ctx.stroke(); }
    // roads
    ctx.strokeStyle = "rgba(110,80,50,.75)"; ctx.lineWidth = Math.max(1, s * .1);
    for (let i = 0; i < N; i++) { if (!tiles[i * 4 + T_ROUTE]) continue; let any = false;
      for (let d = 0; d < 3; d++) { const j = nbr[i][d]; if (j >= 0 && tiles[j * 4 + T_ROUTE]) { ctx.beginPath(); ctx.moveTo(X(i), Y(i)); ctx.lineTo(X(j), Y(j)); ctx.stroke(); any = true; } }
      if (!any) { ctx.beginPath(); ctx.arc(X(i), Y(i), s * .1, 0, 7); ctx.stroke(); } }
    // improvements and resources
    if (s >= 11) for (let i = 0; i < N; i++) {
      const imp = tiles[i * 4 + T_IMP], x = X(i), y = Y(i);
      if (imp !== NONE && siteKind(imp)) { /* camps and ruins: drawn below at every zoom */ }
      else if (imp !== NONE) { ctx.fillStyle = (imp & 0x8000) ? "rgba(180,68,47,.8)" : "rgba(255,250,235,.55)"; ctx.strokeStyle = "rgba(0,0,0,.3)"; ctx.lineWidth = 1; ctx.fillRect(x + r * .3, y + r * .4, r * .22, r * .22); ctx.strokeRect(x + r * .3, y + r * .4, r * .22, r * .22); }
      const res = map.resource[i];
      if (res >= 0) { ctx.fillStyle = "rgba(255,255,255,.85)"; ctx.beginPath(); ctx.arc(x - r * .45, y - r * .3, r * .2, 0, 7); ctx.fill(); ctx.strokeStyle = "rgba(0,0,0,.45)"; ctx.stroke();
        if (s >= 18) { ctx.fillStyle = "#333"; ctx.font = "600 " + Math.round(r * .26) + "px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText((legend.resources[res] || "?").slice(0, 1), x - r * .45, y - r * .29); } }
    }
    // barbarian camps (a tent with a flag) and ancient ruins (two columns under a lintel), at every zoom
    for (let i = 0; i < N; i++) {
      const imp = tiles[i * 4 + T_IMP]; if (imp === NONE) continue;
      const k = siteKind(imp); if (!k) continue;
      const x = X(i), y = Y(i), q = Math.max(4, r * .5);
      ctx.lineWidth = Math.max(1.2, q * .12); ctx.strokeStyle = "#111";
      if (k === "camp") {
        ctx.fillStyle = colour[barbarian] || "#6b1a10";
        ctx.beginPath(); ctx.moveTo(x - q, y + q * .7); ctx.lineTo(x, y - q * .7); ctx.lineTo(x + q, y + q * .7); ctx.closePath(); ctx.fill(); ctx.stroke();

    if (us.length) html += "<br>" + us.map((u) => sw(u[1]) + esc(pshort(u[1])) + " · " + esc(uname(u[2])) + ", здоровье " + u[3]).join("<br>");
    const [q, r] = map.coords[i];
    html += ' <span class="muted">(клетка ' + q + ", " + r + ")</span>";
    $("info").innerHTML = html;
  }

  // ---------- controls ----------
  function go(k) { cur = Math.max(0, Math.min(frames.length - 1, k)); update(); }
  function stop() { playing = false; clearTimeout(timer); $("play").textContent = "▶"; }
  function tick() { if (!playing) return; if (cur >= frames.length - 1) { stop(); return; } go(cur + 1); timer = setTimeout(tick, 1100 / +$("speed").value); }
  $("play").onclick = () => { if (playing) { stop(); return; } if (cur >= frames.length - 1) go(0); playing = true; $("play").textContent = "❚❚"; timer = setTimeout(tick, 400 / +$("speed").value); };
  $("prev").onclick = () => { stop(); go(cur - 1); };
  $("next").onclick = () => { stop(); go(cur + 1); };
  $("first").onclick = () => { stop(); go(0); };
  $("last").onclick = () => { stop(); go(frames.length - 1); };
  $("seek").max = frames.length - 1;
  $("seek").oninput = (e) => { stop(); go(+e.target.value); };
  document.addEventListener("keydown", (e) => {
    if (e.target.tagName === "SELECT" || e.target.tagName === "INPUT" && e.target.type !== "range") return;
    if (e.key === "ArrowLeft") { stop(); go(cur - 1); e.preventDefault(); }
    else if (e.key === "ArrowRight") { stop(); go(cur + 1); e.preventDefault(); }
    else if (e.key === " ") { $("play").click(); e.preventDefault(); }
  });
  function zoom(f, px, py) { const w = canvas.clientWidth, h = canvas.clientHeight; px = px ?? w / 2; py = py ?? h / 2;
    const ns = Math.max(2, Math.min(80, view.s * f)); const k = ns / view.s; view.ox = px - (px - view.ox) * k; view.oy = py - (py - view.oy) * k; view.s = ns; draw(); }
  $("zin").onclick = () => zoom(1.4); $("zout").onclick = () => zoom(1 / 1.4); $("zfit").onclick = () => { fit(); draw(); };
  canvas.addEventListener("wheel", (e) => { e.preventDefault(); const b = canvas.getBoundingClientRect(); zoom(e.deltaY < 0 ? 1.15 : 1 / 1.15, e.clientX - b.left, e.clientY - b.top); }, { passive: false });
  let drag = null;
  canvas.addEventListener("pointerdown", (e) => { drag = { x: e.clientX, y: e.clientY, ox: view.ox, oy: view.oy, moved: false }; canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener("pointermove", (e) => { if (!drag) return; const dx = e.clientX - drag.x, dy = e.clientY - drag.y; if (Math.abs(dx) + Math.abs(dy) > 4) drag.moved = true; if (drag.moved) { view.ox = drag.ox + dx; view.oy = drag.oy + dy; draw(); } });
  canvas.addEventListener("pointerup", (e) => {
    if (drag && !drag.moved) { const b = canvas.getBoundingClientRect(); const px = e.clientX - b.left, py = e.clientY - b.top; let best = -1, bd = Infinity;
      for (let i = 0; i < N; i++) { const d = (X(i) - px) ** 2 + (Y(i) - py) ** 2; if (d < bd) { bd = d; best = i; } }
      if (best >= 0 && bd < (view.s * 1.1) ** 2) { selected = best; info(best); draw(); } }
    drag = null; });
  window.addEventListener("resize", () => { fit(); draw(); });
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);

  // ---------- the empire of one player: this frame, and its decisions over the game ----------
  const DEC = DATA.decisions || {};
  const KINDS = [["tech", "технологии"], ["policy", "политики"], ["branch", "ветви"], ["ideology", "идеология"], ["building", "здания"], ["wonder", "чудеса"],
    ["unit", "отряды"], ["great", "великие люди"], ["pantheon", "пантеон"], ["religion", "религия"], ["belief", "верования"],
    ["founded", "города"], ["captured", "захваты"], ["lost", "потери"], ["trade", "торговые пути"], ["camp", "лагеря"], ["ruins", "руины"]];
  const majors = players.filter((p) => p.kind === "major");
  let empP = learnerSide ?? (majors.find((p) => p.learner) || {}).id;
  if (empP === undefined) { const best = (scene.standings || []).find((x) => x.rank === 1); empP = best ? best.player : (majors[0] || {}).id; }
  $("emp").innerHTML = majors.map((p) => '<option value="' + p.id + '">' + esc(pname(p.id)) + (pmind(p.id) ? " · " + esc(pmind(p.id)) : "") + "</option>").join("");
  $("emp").value = empP;
  $("emp").onchange = (e) => { empP = +e.target.value; tlKinds = null; timeline(); empire(); timelineMark(); };
  const sign = (n) => (n > 0 ? "+" : n < 0 ? "−" : "") + Math.abs(n);
  function decText(d) {
    switch (d.k) {
      case "building": case "wonder": return esc(d.n) + ' <span class="k">— ' + esc(d.c) + "</span>";
      case "unit": return esc(d.n) + ' <span class="k">— ' + esc(d.c) + "</span>";
      case "founded": return "основан город " + esc(d.n);
      case "captured": return "захвачен город " + esc(d.n);
      case "lost": return "потерян город " + esc(d.n);
      case "branch": return "ветвь: " + esc(d.n);
      case "ideology": return "идеология: " + esc(d.n);
      case "pantheon": return "пантеон: " + esc(d.n);
      case "religion": return "основана религия: " + esc(d.n);
      case "belief": return "верование: " + esc(d.n);
      case "great": return "великий человек: " + esc(d.n);
      case "trade": return "торговый путь " + esc(d.n);
      case "wonder_": return esc(d.n);
    }
    return esc(d.n);
  }
  function empire() {
    const st = (frames[cur].empire || {})[empP];
    if (!st) { $("empire").innerHTML = '<p class="k">Нет данных об этом игроке.</p>'; return; }
    const y = st.yields || {};
    const mine = (DEC[empP] || []).filter((d) => d.f === cur);
    let h = "<p><span class=\"k\">Исследует:</span> " + esc(st.research || "—") + "</p>";
    h += "<p>" + sign(y.gold) + " золота · " + sign(y.science) + " науки · " + sign(y.culture) + " культуры · " + sign(y.faith) + " веры · " + y.production + " производства <span class=\"k\">за ход</span></p>";
    h += "<p>" + y.cities + " " + plural(y.cities, "город", "города", "городов") + ", население " + y.pop + " · казна " + y.treasury + " · счастье " + sign(y.happiness) + " · технологий " + y.techs + "</p>";
    h += "<p><span class=\"k\">Политики:</span> " + st.policies + (st.branches.length ? " · ветви: " + st.branches.map(esc).join(", ") : "") + (st.ideology ? " · идеология: " + esc(st.ideology) : "") + "</p>";
    if (st.pantheon || st.religion) h += "<p><span class=\"k\">Вера:</span> " + (st.pantheon ? "пантеон «" + esc(st.pantheon) + "»" : "") + (st.religion ? (st.pantheon ? ", " : "") + "религия «" + esc(st.religion) + "»" : "") + "</p>";
    h += "<p><span class=\"k\">Торговые пути:</span> " + st.routes + "</p>";
    if (st.build.length) h += "<table>" + st.build.map((b) => "<tr><td>" + esc(b[0]) + "</td><td>" + b[1] + "</td><td>" + (b[2] ? esc(b[2]) : '<span class="k">ничего</span>') + "</td></tr>").join("") + "</table>";
    if (mine.length) h += '<p style="margin-top:8px"><span class="k">В этом кадре:</span></p>' + mine.map((d) => "<p>" + decText(d) + "</p>").join("");
    $("empire").innerHTML = h;
  }
  let tlKinds = null;
  function timeline() {
    const list = DEC[empP] || [];
    const counts = new Map(); for (const d of list) counts.set(d.k, (counts.get(d.k) || 0) + 1);
    if (!tlKinds) tlKinds = new Set(KINDS.map((k) => k[0]).filter((k) => k !== "unit"));
    $("tlhead").innerHTML = "Решения за " + (battle ? "запись" : "партию") + ": " + sw(empP) + esc(pname(empP)) + ' <span class="k" style="font-weight:normal">' + esc(pmind(empP)) + "</span>";
    $("tlchips").innerHTML = KINDS.filter((k) => counts.has(k[0])).map((k) => '<button data-k="' + k[0] + '" class="' + (tlKinds.has(k[0]) ? "on" : "") + '">' + k[1] + " · " + counts.get(k[0]) + "</button>").join("");
    $("tlchips").querySelectorAll("button").forEach((b) => b.onclick = () => { const k = b.dataset.k; tlKinds.has(k) ? tlKinds.delete(k) : tlKinds.add(k); timeline(); timelineMark(); });
    const shown = list.filter((d) => tlKinds.has(d.k));
    $("timeline").innerHTML = shown.length ? shown.map((d) => '<li data-f="' + d.f + '"><span class="r">Х' + d.r + "</span> " + decText(d) + "</li>").join("") : '<li class="k">Нет решений выбранных видов.</li>';
    $("timeline").querySelectorAll("li[data-f]").forEach((li) => li.onclick = () => { stop(); go(+li.dataset.f); });
  }
  function timelineMark() { $("timeline").querySelectorAll("li[data-f]").forEach((li) => li.classList.toggle("now", +li.dataset.f === cur)); }
  timeline();

  header(); fit();
  // A battle opens zoomed so a hex is readable on a phone; a whole map opens whole.
  if (battle && view.s < 22 && scene.target_i != null) { const t = scene.target_i; const w = canvas.clientWidth, h = canvas.clientHeight; view.s = Math.min(26, Math.max(view.s, 22)); view.ox = w / 2 - cx[t] * view.s; view.oy = h / 2 - cy[t] * view.s; }
  const m = /f=(\d+)/.exec(location.hash); if (m) cur = Math.max(0, Math.min(frames.length - 1, +m[1] - 1));
  update();
})();
</script>
</body>
</html>
