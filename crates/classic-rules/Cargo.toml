[package]
name = "classic-rules"
version = "0.1.0"
edition = "2021"
description = "Rules module of Aurelia, a game inspired by Unciv with a similar rule set."
license = "MIT OR Apache-2.0"
authors = ["The Aurelia contributors"]
repository = "https://github.com/sirgl/aurelia-classic"
keywords = ["strategy", "rules", "gamedev"]
categories = ["game-development", "simulation"]
rust-version = "1.98"
publish = false

[dependencies]
kernel = { package = "aurelia-kernel", path = "../../../platform/crates/kernel" }
prof = { package = "aurelia-prof", path = "../../../platform/crates/prof" }
# v2 in process on the GPU (`ai/net_e2e/v2/gpu.rs`, the `gpu` feature): wgpu compute in WGSL, so
# the same kernels run on Metal, Vulkan, DX12 and WebGPU (wasm32).
wgpu = { version = "30.0.1", optional = true }
pollster = { version = "1.0.1", optional = true }

# Test content fixtures as RON strings (dogfooding, no hardcoding).
# Unit tests: their own minimal schema through generic ron/serde (the LIB is clean and
# has no content dependency: the dev cycle core<->content makes cargo build two
# instances of the crate; verified). Integration/examples: a dev-dep on classic-content
# (as in nation-render: there is a single instance, no cycle).
[dev-dependencies]
kernel = { package = "aurelia-kernel", path = "../../../platform/crates/kernel", features = ["harness", "test-fixtures"] }
classic-content = { path = "../classic-content" }
ron = "0.12.2"
serde = { version = "1.0.229", features = ["derive"] }
classic-rules = { path = ".", features = ["harness"] }

[features]
harness = ["kernel/harness"]
# The experimental AI: the end-to-end nets (`ai::net_e2e`, v2 and the small one), the unit net,
# the variants that need them and the bench's control `standard-scripted` (the standard before the
# strategy net). NOT in the game: the launchers and the UI do not turn it on; the AI bench
# (aurelia-qa) does. Without it the game's AI is `Variant::Standard` (with the strategy net, its
# 266 weights in `ai::strategy_net::weights`, since the twelfth promotion) whatever
# `AURELIA_AI_VARIANT` says, and the two tables of the site net and the choice net (played only by
# `Variant::SiteNet` and the `ChoiceNet*` variants) are not compiled.
experimental-ai = []
gpu = ["experimental-ai", "dep:wgpu", "dep:pollster"]

# The tests and the example of the experimental AI (the nets) need `experimental-ai`; `cargo test
# --features experimental-ai` runs them.
[[test]]
name = "ai_unit_net"
required-features = ["experimental-ai"]

[[test]]
name = "net_e2e_mind"
required-features = ["experimental-ai"]

[[test]]
name = "net_e2e_model"
required-features = ["experimental-ai"]

[[test]]
name = "net_e2e_move_strike"
required-features = ["experimental-ai"]

[[test]]
name = "net_e2e_remote"
required-features = ["experimental-ai"]

[[test]]
name = "net_e2e_sample"
required-features = ["experimental-ai"]

[[test]]
name = "net_e2e_speed"
required-features = ["experimental-ai"]

[[test]]
name = "site_net"
required-features = ["experimental-ai"]

[[example]]
name = "v2_check"
required-features = ["experimental-ai"]
