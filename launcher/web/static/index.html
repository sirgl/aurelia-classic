<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Mobile mode rewrites this tag (mode.js): no pinch zoom of the page, content under the notch. -->
<meta name="viewport" id="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aurelia</title>
<meta name="description" content="Aurelia: a turn-based strategy game inspired by Unciv and Civ 5, in the browser.">
<meta name="theme-color" content="#0b1418">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Aurelia">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="48x48" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script src="mode.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #0b1418; color: #cfe0dc; font-family: system-ui, sans-serif; overflow: hidden; overscroll-behavior: none; }
  canvas { display: block; width: 100vw; height: 100vh; outline: none; }
  #overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: #0b1418; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  #overlay.done { display: none; }
  #bar { width: min(420px, 70vw); height: 6px; background: #1d2f35; border-radius: 3px; overflow: hidden; }
  #fill { height: 100%; width: 0; background: #6fb3a5; transition: width .15s; }
  #failure { max-width: 70ch; color: #f0b3a8; text-align: center; white-space: pre-wrap; }
  #play { display: none; font: inherit; font-size: 18px; min-height: 48px; padding: 0 28px; border-radius: 24px; border: 0; background: #6fb3a5; color: #0b1418; }
  #overlay.ready #bar { display: none; }
  #overlay.ready #play { display: inline-block; }
  #modes { margin-top: 8px; font-size: 14px; color: #8fa7a2; text-align: center; }
  #modes a { color: #9fd0c4; padding: 12px 6px; display: inline-block; }
  #skip { display: none; }
  #overlay.ready #skip { display: inline-block; }
  .nojs { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; background: #0b1418; text-align: center; padding: 16px; z-index: 10; }
  .nojs a { color: #9fd0c4; }
  /* Mobile mode: the page never scrolls, zooms or selects; the canvas follows the visible area. */
  html[data-mode="mobile"] body { position: fixed; inset: 0; width: 100%; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  html[data-mode="mobile"] canvas { position: fixed; left: 0; top: var(--top, 0px); width: 100%; height: var(--vh, 100dvh); touch-action: none; }
  #hint { display: none; position: fixed; z-index: 5; left: 0; right: 0; top: 0; align-items: center; justify-content: space-between; gap: 8px; box-sizing: border-box; padding: max(4px, env(safe-area-inset-top)) 8px 4px 16px; min-height: 36px; background: #1d2f35; color: #cfe0dc; font-size: 13px; }
  html[data-mode="mobile"] #hint:not([hidden]) { display: flex; }
  #hint button { font: inherit; font-size: 20px; line-height: 1; min-width: 44px; min-height: 36px; background: none; border: 0; color: inherit; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="0"></canvas>
<div id="hint" hidden><span></span><button type="button" aria-label="Close">&times;</button></div>
<div id="overlay"><div id="status">Loading</div><div id="bar"><div id="fill"></div></div><button id="play" type="button"></button><a id="skip" href="#" style="color:#8fa7a2;font-size:14px;padding:12px"></a><div id="failure"></div><div id="modes"></div></div>
<noscript><div class="nojs">
  <div>Aurelia runs in the browser and needs JavaScript and WebAssembly. Please turn JavaScript on for this page.</div>
  <div><a href="?mode=desktop">Desktop version</a> &middot; <a href="?mode=mobile">Phone and tablet version</a></div>
</div></noscript>
<script type="module">
import init, * as api from "./pkg/web.js";
const { run, set_manifest, register_asset, take_wanted, asset_stats, take_trace, take_picture_requests, register_picture, fail_picture } = api;
window.aureliaApi = api; // for tests and tools: wants_keyboard(), push_text()...
import { mark, drain, tracing } from "./trace.js";
import { createArt } from "./art.js";

// The page's own few words, in the browser's language (the game has its own language setting).
const TEXT = {
  en: { loading: "Loading", engine: "Loading the engine", index: "Loading the art index", art: "Loading the art", gpu: "Opening the GPU", failed: "Aurelia cannot start", play: "Play fullscreen", browser: "Play in the browser", rotate: "The game is easier to play with the phone turned sideways.", mobile: "Phone and tablet mode", desktop: "Desktop mode", toDesktop: "Switch to desktop mode", toMobile: "Switch to phone and tablet mode", close: "Close" },
  ru: { loading: "\u0417\u0430\u0433\u0440\u0443\u0437\u043a\u0430", engine: "\u0417\u0430\u0433\u0440\u0443\u0437\u043a\u0430 \u0434\u0432\u0438\u0436\u043a\u0430", index: "\u0417\u0430\u0433\u0440\u0443\u0437\u043a\u0430 \u0441\u043f\u0438\u0441\u043a\u0430 \u043a\u0430\u0440\u0442\u0438\u043d\u043e\u043a", art: "\u0417\u0430\u0433\u0440\u0443\u0437\u043a\u0430 \u043a\u0430\u0440\u0442\u0438\u043d\u043e\u043a", gpu: "\u0417\u0430\u043f\u0443\u0441\u043a \u0432\u0438\u0434\u0435\u043e\u043a\u0430\u0440\u0442\u044b", failed: "Aurelia \u043d\u0435 \u0437\u0430\u043f\u0443\u0441\u043a\u0430\u0435\u0442\u0441\u044f", play: "\u0418\u0433\u0440\u0430\u0442\u044c \u043d\u0430 \u0432\u0435\u0441\u044c \u044d\u043a\u0440\u0430\u043d", browser: "\u0418\u0433\u0440\u0430\u0442\u044c \u0432 \u0431\u0440\u0430\u0443\u0437\u0435\u0440\u0435", rotate: "\u0412 \u0438\u0433\u0440\u0443 \u0443\u0434\u043e\u0431\u043d\u0435\u0435 \u0438\u0433\u0440\u0430\u0442\u044c, \u043f\u043e\u0432\u0435\u0440\u043d\u0443\u0432 \u0442\u0435\u043b\u0435\u0444\u043e\u043d \u043d\u0430\u0431\u043e\u043a.", mobile: "\u0420\u0435\u0436\u0438\u043c \u0434\u043b\u044f \u0442\u0435\u043b\u0435\u0444\u043e\u043d\u0430 \u0438 \u043f\u043b\u0430\u043d\u0448\u0435\u0442\u0430", desktop: "\u0420\u0435\u0436\u0438\u043c \u0434\u043b\u044f \u043a\u043e\u043c\u043f\u044c\u044e\u0442\u0435\u0440\u0430", toDesktop: "\u0412\u043a\u043b\u044e\u0447\u0438\u0442\u044c \u0440\u0435\u0436\u0438\u043c \u0434\u043b\u044f \u043a\u043e\u043c\u043f\u044c\u044e\u0442\u0435\u0440\u0430", toMobile: "\u0412\u043a\u043b\u044e\u0447\u0438\u0442\u044c \u0440\u0435\u0436\u0438\u043c \u0434\u043b\u044f \u0442\u0435\u043b\u0435\u0444\u043e\u043d\u0430 \u0438 \u043f\u043b\u0430\u043d\u0448\u0435\u0442\u0430", close: "\u0417\u0430\u043a\u0440\u044b\u0442\u044c" },
  de: { loading: "Lädt", engine: "Spiel wird geladen", index: "Bilderliste wird geladen", art: "Bilder werden geladen", gpu: "Grafikkarte wird geöffnet", failed: "Aurelia kann nicht starten", play: "Im Vollbild spielen", browser: "Im Browser spielen", rotate: "Das Spiel lässt sich quer besser spielen.", mobile: "Modus für Handy und Tablet", desktop: "Desktop-Modus", toDesktop: "Zum Desktop-Modus wechseln", toMobile: "Zum Handy-Modus wechseln", close: "Schließen" },
  fr: { loading: "Chargement", engine: "Chargement du moteur", index: "Chargement de l'index des images", art: "Chargement des images", gpu: "Ouverture du GPU", failed: "Aurelia ne peut pas démarrer", play: "Jouer en plein écran", browser: "Jouer dans le navigateur", rotate: "Le jeu se joue mieux en tenant le téléphone à l'horizontale.", mobile: "Mode téléphone et tablette", desktop: "Mode ordinateur", toDesktop: "Passer au mode ordinateur", toMobile: "Passer au mode téléphone", close: "Fermer" },
  es: { loading: "Cargando", engine: "Cargando el motor", index: "Cargando el índice de imágenes", art: "Cargando las imágenes", gpu: "Abriendo la GPU", failed: "Aurelia no puede iniciarse", play: "Jugar a pantalla completa", browser: "Jugar en el navegador", rotate: "El juego se maneja mejor con el móvil en horizontal.", mobile: "Modo móvil y tableta", desktop: "Modo ordenador", toDesktop: "Cambiar al modo ordenador", toMobile: "Cambiar al modo móvil", close: "Cerrar" },
  ja: { loading: "読み込み中", engine: "エンジンを読み込み中", index: "画像の一覧を読み込み中", art: "画像を読み込み中", gpu: "GPUを起動中", failed: "Aureliaを起動できません", play: "全画面でプレイ", browser: "ブラウザでプレイ", rotate: "スマートフォンを横向きにすると遊びやすくなります。", mobile: "スマホ・タブレット用モード", desktop: "パソコン用モード", toDesktop: "パソコン用モードに切り替える", toMobile: "スマホ用モードに切り替える", close: "閉じる" },
  zh: { loading: "加载中", engine: "正在加载引擎", index: "正在加载图片索引", art: "正在加载图片", gpu: "正在启动显卡", failed: "Aurelia 无法启动", play: "全屏游玩", browser: "在浏览器中游玩", rotate: "横屏握持手机时更容易游玩。", mobile: "手机和平板模式", desktop: "桌面模式", toDesktop: "切换到桌面模式", toMobile: "切换到手机模式", close: "关闭" },
};
const language = (navigator.languages && navigator.languages[0] || navigator.language || "en").toLowerCase().split("-")[0];
const text = TEXT[language] || TEXT.en;
document.documentElement.lang = TEXT[language] ? language : "en";

const $ = (id) => document.getElementById(id);
const mode = window.aureliaMode;
const mobile = mode.mode === "mobile";
const status = (message, share) => {
  $("status").textContent = message;
  if (share !== undefined) $("fill").style.width = `${Math.round(share * 100)}%`;
};
const fail = (message) => {
  $("failure").textContent = message;
  status(text.failed);
};
status(text.loading);

// The way to the other mode: a plain link (works with a middle click too) that also remembers the choice.
const other = mobile ? "desktop" : "mobile";
$("modes").innerHTML = "";
{
  const name = document.createElement("div");
  name.textContent = mobile ? text.mobile : text.desktop;
  const link = document.createElement("a");
  link.href = mode.url(other);
  link.textContent = mobile ? text.toDesktop : text.toMobile;
  link.addEventListener("click", (event) => { event.preventDefault(); mode.switchTo(other); });
  $("modes").append(name, link);
}
$("hint").querySelector("button").setAttribute("aria-label", text.close);

// Where the art lives: the page's own `assets/` folder, or any origin that serves the same
// tree with CORS (GET from this page's origin), e.g. ?assets=https://art.example.com/v3/
const base = new URLSearchParams(location.search).get("assets") || "assets/";
const fetched = { files: 0, bytes: 0, failed: 0 };
// Pictures: fetched, decoded by the browser and handed over by the art service (art.js).
const art = window.__art = createArt(base);
art.prefetch("visual/generated/menu-v1.webp");  // the menu cover loads while the wasm compiles
const bytesOf = async (path) => {
  mark("fetch", path);
  const response = await fetch(`${base}${path}`);
  if (!response.ok) throw new Error(`${path}: HTTP ${response.status}`);
  const bytes = new Uint8Array(await response.arrayBuffer());
  mark("fetched", path, String(bytes.length));
  return bytes;
};
// The manifest and the files the first frame reads (atlas indexes, fonts) do not need the engine:
// they are fetched while the wasm downloads and compiles, and handed over once it runs.
const early = (async () => {
  const manifest = await (await fetch(`${base}manifest.tsv`)).text();
  const paths = manifest.split("\n").map((line) => line.split("\t")[0]).filter(Boolean);
  const boot = paths.filter((p) => p.endsWith(".tsv") || p.startsWith("fonts/"));
  return { manifest, boot, bytes: boot.map((p) => bytesOf(p).catch((error) => { console.warn(error); return null; })) };
})();
early.catch(() => {});
const register = (path, bytes) => {
  if (!bytes) { fetched.failed += 1; return; }
  register_asset(path, bytes);
  fetched.files += 1;
  fetched.bytes += bytes.length;
};
const load = async (path) => {
  try {
    register(path, await bytesOf(path));
  } catch (error) {
    fetched.failed += 1;
    console.warn(error);
  }
};

try {
  const started = performance.now();
  status(text.engine, 0.05);
  // The mobile glue is a small separate file: a desktop page never fetches it.
  const phone = mobile ? await import("./mobile.js") : null;
  const wasm = await init();
  status(text.index, 0.3);
  const { manifest, boot, bytes } = await early;
  set_manifest(manifest);
  let done = 0;
  await Promise.all(boot.map(async (p, i) => { register(p, await bytes[i]); status(`${text.art} (${++done}/${boot.length})`, 0.3 + 0.6 * done / boot.length); }));
  status(text.gpu, 0.95);
  api.offer_mode_switch(mobile);
  phone?.prepare(api, { canvas: $("canvas"), hint: $("hint"), text });
  await run("canvas");
  window.__boot = { ms: performance.now() - started, wasmBytes: wasm.memory.buffer.byteLength, bootFiles: boot.length, bootBytes: fetched.bytes, mode: mode.mode, source: mode.source };
  const overlay = $("overlay");
  if (phone && phone.canEnterFullscreen()) {
    // One tap for what a browser only allows from a gesture: fullscreen, landscape, screen kept on.
    status(text.loading + " ✓");
    $("status").textContent = "";
    $("play").textContent = text.play;
    $("skip").textContent = text.browser;
    overlay.classList.add("ready");
    $("play").addEventListener("click", async () => { await phone.enterFullscreen(); phone.keepAwake(); overlay.classList.add("done"); });
    $("skip").addEventListener("click", (event) => { event.preventDefault(); overlay.classList.add("done"); });
  } else {
    overlay.classList.add("done");
    phone?.keepAwake();
  }
  // The game asks for pictures as screens show them; fetch what it listed.
  const pump = async () => {
    const wanted = Array.from(take_wanted());
    if (wanted.length) (window.__pumped ||= []).push(...wanted);
    await Promise.all(wanted.map(load));
    window.__fetched = fetched;
    setTimeout(pump, wanted.length ? 0 : 150);
  };
  pump();
  art.bind({ register: register_picture, fail: fail_picture });
  setInterval(() => { const rows = take_picture_requests(); if (rows) art.update(rows); }, 20);
  if (tracing) setInterval(() => drain(take_trace), 50);
} catch (error) {
  console.error(error);
  fail(String(error && error.message ? error.message : error));
}
</script>
</body>
</html>
