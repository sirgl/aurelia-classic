# Product metadata of the classic game's launcher, read by platform/tools/launcher/*.sh (POSIX sh variables).
NAME=aurelia
PRODUCT=Aurelia
PRODUCT_FILE=Aurelia
DESKTOP_PACKAGE=classic-desktop
DESKTOP_BIN=aurelia-classic
WEB_PACKAGE=classic-web
ANDROID_PACKAGE=classic-android
ANDROID_LIB=aurelia_classic
# The art pack that ships with the game (fetched by platform/tools/fetch-assets.sh).
ART_DIR=classic/assets
