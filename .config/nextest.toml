fail-fast = false
failure-output = "final"
status-level = "fail"
final-status-level = "slow"
# THE GUARD: a fast-tier test that runs 2 s is reported SLOW (tools/test-budget.py fails on it), one that runs
# 6 s is terminated and fails (TIMEOUT), so a loaded machine does not fail a run by itself. The author moves the
# test to the slow set above (add it to the filter) or makes it fast; see docs/testing.md, "Two tiers". The slowest fast test
# takes about 0.5 s.
slow-timeout = { period = "2s", terminate-after = 3 }

[[profile.default.overrides]]
filter = """
    (binary_id(=aurelia-qa::ai_bench) & test(=the_smoke_suite_gives_the_same_result_on_any_number_of_threads))
  | (binary_id(=classic-rules::net_e2e_mind) & (test(=the_encoding_of_a_fixed_state_is_pinned) | test(=a_game_of_nets_with_pinned_weights_is_pinned)))
  | (binary_id(=classic-rules::baseline_hashes) & test(=core_game_hash_baseline))
  | (binary_id(=classic-rules::classic_game) & test(=classic_game_runs_100_rounds_and_replays_to_the_pinned_hash))
  | (binary_id(=classic-rules::fuzz_sim) & test(=fuzz_world_hash_baseline))
  | (binary_id(=classic-rules::rules_fingerprint) & test(=the_classic_fingerprint_is_pinned))
  | (binary_id(=classic-rules::save_codec) & test(=the_codec_reads_classic_saves_byte_for_byte))
  | (binary_id(=classic-rules::main_snapshot) & test(=the_frozen_main_game_still_opens_validates_and_hashes_the_same))
  | (binary_id(=aurelia-qa::ai_export) & test(=the_layout_is_pinned))
"""
test-group = "pins"
slow-timeout = { period = "10s", terminate-after = 3 }

# The longest tests start first: nextest starts tests in the order of the binaries, so a 10-second test
# that happens to sit last would start when the others are done and set the end of the run. Priority
# only orders the start; it changes nothing a test checks. Refresh the list from the junit file
# (docs/testing.md, "The time budget") when a test above 3 s appears or one of these drops under 1 s.
[[profile.default.overrides]]
filter = """
    (binary_id(=aurelia-qa::ai_selfplay) & test(=given_space_techs_reach_the_science_victory))
  | (binary_id(=aurelia-qa::ai_ladder_solvable) & test(=scene_37_is_drawn_again_at_attempt_6))
  | (binary_id(=classic-rules::ai_track_b) & test(=ai_adopts_policies_and_founds_a_religion_in_a_classic_game))
  | (binary_id(=classic-rules::ai_economy) & test(=the_ai_runs_trade_routes))
  | (binary_id(=classic-rules::ai_acceptance) & test(~war_and_peace_do_not_flip_on_seed))
"""
priority = 100

[profile.full]
# Everything `cargo test --workspace` runs: the GPU tests too (they open the machine's GPU). `--run-ignored all` adds the `#[ignore]`d measurements on top.
default-filter = "all()"
# Generous: the slow tests take up to 30 s on a busy machine; 5 minutes is a hang.
slow-timeout = { period = "60s", terminate-after = 5 }

# Timing runs (docs/testing.md, "The time budget"): the same tests as `default` / `full`, plus a
# JUnit file with the time of every test: target/nextest/<profile>/junit.xml.
[profile.measure]
inherits = "default"
status-level = "all"
final-status-level = "slow"
[profile.measure.junit]
path = "junit.xml"

[profile.measure-full]
inherits = "full"
status-level = "all"
final-status-level = "slow"
[profile.measure-full.junit]
path = "junit.xml"
