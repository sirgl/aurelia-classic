# Test profiles for cargo-nextest (docs/testing.md).
#
#   fast tier (the default):  cargo +1.98.1 nextest run --cargo-profile fasttest --build-jobs 4 --test-threads 4 --workspace
#   everything:               the same with `--profile full` (the slow tier and the GPU tests too)
#   changed:                  tools/test-changed.sh
#
# Two tiers (docs/testing.md, "Two tiers"): `default` is the fast tier, `full` is every test. Nothing here
# changes what a test checks, and no test is removed or ignored. The `pins` group is the set of cheap
# pinned games that `tools/test-changed.sh` always runs, whatever changed.

[test-groups]
# Cheap pins (each under 3 s in release, 12 s at the fasttest opt-level): any change of the rules,
# the AI, the kernel, the encodings or the save format moves at least one of these hashes.
pins = { max-threads = "num-cpus" }

[profile.default]
# THE FAST TIER: every test but the GPU tests and the SLOW set. Nothing is deleted or ignored: `--profile full`
# runs all of it (docs/testing.md, "Two tiers"). The aim is the fast tier in 30 s on 4 threads.
#
# The slow set is decided by measurement, one rule: a test that took more than 0.5 s on 4 threads (junit of
# `--profile measure-full`, 22 November 2026) is slow. It is listed here by test binary and name, in this one
# place, and nowhere else: moving a test between the tiers is a one-line edit of this filter. A whole binary
# is listed when all its tests are slow. The pins (group `pins` below) stay in the fast tier whatever they take.
# The GPU tests (first line) open the machine's GPU: they are in `full` only.
default-filter = """
not (package(=classic-ui) & (binary(=render_scale) | binary(=render_headless) | binary(=new_match_frame) | binary(=hud_overlap)))
and not (
  (binary_id(=aurelia-qa::ai_battle) & (test(=both_sides_attack)))
  | (binary_id(=aurelia-qa::ai_bench) & (
          test(=a_sequential_run_against_its_saved_reports_differs_by_nothing)
        | test(=a_sequential_run_of_equal_versions_plays_to_the_cap)
