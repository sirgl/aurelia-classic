# CI of the classic repository. A TEMPLATE: it lives in classic/.github-template/ and is not run from
# here; at publication move this folder to .github/ (docs/publishing.md in the monorepo; fill the placeholders).
# Private repository; it needs the platform repository beside it. The naming and source guards (tools/rename-classic.sh, tools/sources-lint.sh) read git state in the monorepo layout and run there only. NOT RUN YET (written without a runner).
name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: 1.98.1
  CARGO_TERM_COLOR: always
  # The repositories of the split sit side by side in the workspace folder (platform/, lands/, ...);
  # the guard scripts take that folder as their root (they cannot use git's top level).
  AURELIA_ROOT: ${{ github.workspace }}

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          path: classic
      - uses: actions/checkout@v4.2.2
        with:
          repository: sirgl/aurelia-platform   # the platform repository, checked out beside this one
          path: platform
      - name: Install Rust
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake clang libssl-dev libasound2-dev libudev-dev \
            libwayland-dev libxkbcommon-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libvulkan-dev \
            mesa-vulkan-drivers
      - uses: actions/cache@v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            classic/target
          key: classic-${{ runner.os }}-${{ hashFiles('classic/Cargo.lock') }}
          restore-keys: classic-${{ runner.os }}-
      - name: Build (all targets)
        working-directory: classic
        run: cargo +$RUST_TOOLCHAIN check --workspace --all-targets
      - name: Document links
        run: python3 -I classic/tools/check-doc-links.py
      - name: Tests (no GPU, no art)
        working-directory: classic
        run: cargo +$RUST_TOOLCHAIN test --release -p classic-rules -p classic-content
      - name: Offscreen screenshot of the menu
        working-directory: classic
        run: |
          cargo +$RUST_TOOLCHAIN build --release -p classic-desktop --bin aurelia-classic
          AURELIA_GAME_SCREEN=menu target/release/aurelia-classic --screenshot menu.png
          test -s menu.png
